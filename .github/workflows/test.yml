name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs_version:
          - 31.1
    steps:
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - uses: actions/checkout@v5
      - name: Build the tree-sitter grammar
        run: make grammar
      - name: Lint
        run: make lint
      - name: Test
        run: make test
